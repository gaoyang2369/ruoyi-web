# HTTP 入口：内网未安装自签证书的访问者仍可继续使用
server {
    listen 5137;
    server_name localhost;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # 静态文件目录
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/app.locations;
}

# HTTPS 入口：自签证书（certs/ 目录构建进镜像），客户端安装信任后浏览器显示安全锁
server {
    listen 5443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # 静态文件目录
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/app.locations;
}
